spring:
  application:
    name: blueprint-manager
  session:
    store-type: none
  config.import: optional:${app.fullFilePath}/${app.overridesFileName}, optional:${app.fullFilePath}/security.properties, classpath:canvas.properties, optional:classpath:git.properties, classpath:lti-registrations.properties
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    # Two separate JPA modules are now on the classpath (lti-framework's LtiClientConfig and
    # canvas-oauth2-client's CanvasOAuth2ClientConfig), each with its own EntityManagerFactory bean
    # and neither marked @Primary - blueprint-manager has no JPA entities/config of its own to break
    # the tie the way other tools' local @Primary-annotated PostgresDBConfig does. Spring Boot's
    # open-in-view interceptor autoconfiguration needs exactly one EntityManagerFactory bean to
    # autowire and fails to start otherwise ("... required a single bean, but 2 were found").
    # blueprint-manager never renders a JPA entity's lazy associations in a view (it has none of its
    # own - see courselist's application.yml for the tool that hit this first), so open-in-view has
    # no purpose here - disabling it removes the ambiguous injection point entirely rather than
    # adding a bean just to satisfy it.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        boot:
          allow_jdbc_metadata_access: false
      jadira:
        usertype:
          autoRegisterUserTypes: true
  datasource:
    url: ${lms.db.url}
    username: ${lms.db.user}
    password: ${lms.db.password}
    type: ${lms.db.poolType}
  cloud.vault.enabled: false
#  output:
#    ansi:
#      enabled: ALWAYS
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${oauth.tokenprovider.url}/.well-known/jwks.json
      client:
        registration:
          lms_canvas_oauth2_blueprintmanager:
            client-id: ${canvas.oauth2.clientId}
            client-secret: ${canvas.oauth2.clientSecret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - url:GET|/api/v1/courses/:id
              - url:GET|/api/v1/courses/:course_id/users
              - url:GET|/api/v1/courses/:course_id/blueprint_templates/:template_id/associated_courses
              - url:GET|/api/v1/courses/:course_id/blueprint_templates/:template_id/migrations
              - url:POST|/api/v1/courses/:course_id/blueprint_templates/:template_id/migrations
              - url:GET|/api/v1/courses/:course_id/blueprint_subscriptions/:subscription_id/migrations
              - url:GET|/api/v1/users/:user_id/courses
              - url:GET|/api/v1/accounts/:account_id/terms
        provider:
          lms_canvas_oauth2_blueprintmanager:
            authorization-uri: ${canvas.baseUrl}/login/oauth2/auth
            token-uri: ${canvas.baseUrl}/login/oauth2/token
  web.error.whitelabel.enabled: false
canvas:
  oauth2:
    enabled: true
    clientId: ${canvas.oauth2.clientId.blueprintmanager}
    clientSecret: ${canvas.oauth2.clientSecret.blueprintmanager}

server:
  servlet:
    session:
      timeout: 30m
blueprint-manager:
  version: @app.version@
  env: ${app.env}

app:
  env: dev
  fullFilePath: file:/usr/src/app/config
  overridesFileName: overrides.properties

management:
  endpoint.lms.enabled: true
  endpoints.web.exposure.include: health,lms
  health.redis.enabled: false
  info.java.enabled: true

---

spring:
  config.activate.on-profile: redis-session
  session.data.redis.namespace: blueprint-manager-@app.version@:session
management.health.redis.enabled: true

---

spring:
  config:
    activate.on-profile: vault
    import: vault://
  cloud.vault:
    enabled: true
    config:
      lifecycle.lease-endpoints: leases
    generic:
      enabled: false
    kv:
      enabled: true
      backend: ua-vpit/enterprise-systems/lms/kv
      application-name: blueprint-manager